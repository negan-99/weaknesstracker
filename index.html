<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>과외 학생 관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #EDF0F2;
  }
  #wt-root {
    --paper: #EDF0F2;
    --card: #FFFFFF;
    --ink: #1C2331;
    --ink-soft: #5B6472;
    --ink-faint: #9AA2AC;
    --pen: #2C5C86;
    --pen-tint: #E3ECF3;
    --red: #B03A32;
    --red-tint: #F6E4E2;
    --green: #2F6E4E;
    --green-tint: #E2EFE7;
    --amber: #A8720F;
    --amber-tint: #F5E9D3;
    --line: #D6DAE1;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);
    background: var(--paper);
    padding: 20px 16px 40px;
    box-sizing: border-box;
    min-height: 100vh;
  }
  #wt-root * { box-sizing: border-box; }
  #wt-root .disp { font-family: 'Space Grotesk', 'Noto Sans KR', sans-serif; }
  #wt-root .mono { font-family: 'JetBrains Mono', monospace; }
  #wt-root button {
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    border: none;
    background: none;
  }
  #wt-root input, #wt-root textarea, #wt-root select {
    font-family: 'Noto Sans KR', sans-serif;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 15.5px;
    background: #fff;
    color: var(--ink);
    width: 100%;
  }
  #wt-root input:focus, #wt-root textarea:focus, #wt-root select:focus {
    outline: none;
    border-color: var(--pen);
  }
  #wt-root .btn-primary {
    background: var(--pen);
    color: #fff;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 15.5px;
    font-weight: 500;
  }
  #wt-root .btn-primary:hover { background: #234a6c; }
  #wt-root .btn-ghost {
    color: var(--pen);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 15.5px;
    border: 1px solid var(--line);
    background: #fff;
  }
  #wt-root .btn-ghost:hover { background: var(--pen-tint); }
  #wt-root .btn-text {
    color: var(--ink-soft);
    font-size: 14.5px;
    padding: 4px 6px;
  }
  #wt-root .btn-text:hover { color: var(--ink); }
  #wt-root .btn-danger-text { color: var(--red); font-size: 14.5px; padding: 4px 6px; }
  #wt-root .btn-danger-text:hover { color: #7d2822; }

  /* iOS는 입력창 글자 크기가 16px보다 작으면 포커스할 때 화면을 확대해버려요 */
  #wt-root input, #wt-root textarea, #wt-root select {
    font-size: 16px;
  }

  @media (max-width: 640px) {
    #wt-root {
      padding: 16px;
      border-radius: 0;
    }
    /* 날짜 입력칸 등 데스크탑 기준 고정폭들을 화면 폭에 맞게 풀어줌 */
    #wt-root input[type="date"] {
      max-width: 100% !important;
      width: 100%;
    }
    /* 날짜 입력이 들어있는 가로 배치 행은 좁은 화면에서 자동으로 줄바꿈 */
    #wt-root div:has(> input[type="date"]) {
      flex-wrap: wrap;
      row-gap: 8px;
    }
    /* 버튼 탭 영역을 넓혀서 손가락으로 누르기 쉽게 */
    #wt-root .btn-text, #wt-root .btn-danger-text {
      padding: 8px 10px;
      font-size: 15.5px;
    }
    #wt-root .btn-primary, #wt-root .btn-ghost {
      padding: 11px 16px;
      font-size: 16px;
    }
    #wt-root input, #wt-root textarea, #wt-root select, #wt-root button {
      min-height: 40px;
    }
    #wt-root .disp {
      word-break: keep-all;
    }
  }
</style>
</head>
<body>

<div id="wt-root"></div>

<script>
(function(){
  const root = document.getElementById('wt-root');
  const INDEX_KEY = 'wt-index-v2';
  function studentKey(id){ return 'wt-student-v2-' + id; }

  // ---- Supabase 설정: 아래 두 값을 자신의 Supabase 프로젝트 값으로 채워주세요 ----
  // Project Settings -> API 에서 확인할 수 있어요.
  const SUPABASE_URL = 'https://ypivyntsumkjytftjrxs.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_0B8yPfaon7VQMCA8Q-Jpig_3xkDP3-X';
  const SUPABASE_TABLE = 'wt_storage';

  // Claude.ai의 아티팩트 샌드박스는 외부 네트워크 요청을 내부적으로 우회시키는데,
  // 이 과정에서 Headers 객체를 postMessage로 못 넘겨서 에러가 나는 경우가 있어요.
  // 요청을 보내기 전에 headers를 항상 순수 객체(plain object)로 바꿔서 이 문제를 피합니다.
  function sandboxSafeFetch(input, init){
    init = init || {};
    var normalized = {};
    for (var k in init) { if (Object.prototype.hasOwnProperty.call(init, k)) normalized[k] = init[k]; }
    if (init.headers) {
      var plainHeaders = {};
      if (typeof Headers !== 'undefined' && init.headers instanceof Headers) {
        init.headers.forEach(function(value, key){ plainHeaders[key] = value; });
      } else if (init.headers instanceof Map) {
        init.headers.forEach(function(value, key){ plainHeaders[key] = value; });
      } else if (Array.isArray(init.headers)) {
        init.headers.forEach(function(pair){ plainHeaders[pair[0]] = pair[1]; });
      } else {
        plainHeaders = Object.assign({}, init.headers);
      }
      normalized.headers = plainHeaders;
    }
    return window.fetch(input, normalized);
  }

  let sbClient = null;
  if (SUPABASE_URL && SUPABASE_ANON_KEY
      && SUPABASE_URL.indexOf('YOUR_') !== 0 && SUPABASE_ANON_KEY.indexOf('YOUR_') !== 0
      && typeof window.supabase !== 'undefined') {
    try {
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        global: { fetch: sandboxSafeFetch }
      });
    }
    catch(e) { sbClient = null; }
  }

  let sbLastRawError = null;

  async function sbGet(key){
    const { data, error } = await sbClient.from(SUPABASE_TABLE).select('value').eq('key', key).maybeSingle();
    if (error) { sbLastRawError = error; throw error; }
    if (!data) { throw new Error('not found'); }
    return { key, value: data.value };
  }
  async function sbSet(key, value){
    const { error } = await sbClient.from(SUPABASE_TABLE).upsert({ key, value, updated_at: new Date().toISOString() });
    if (error) { sbLastRawError = error; throw error; }
    return { key, value };
  }
  // ---- Supabase 설정 끝 ----

  let index = [];
  let studentData = null;
  let mode = 'teacher';
  let currentStudentId = null;
  let ui = {
    addStudentOpen: false,
    addWeaknessOpen: false,
    addProgressOpen: false,
    checkinOpenFor: null,
    checkinPrefillStatus: null,
    endedExpanded: false,
    editingWeaknessId: null,
    editingCheckinKey: null,
    editingProgressId: null,
    editingStudentName: false,
    addExamOpen: false,
    editingExamId: null,
    pastExamsExpanded: false,
    addNoteOpen: false,
    editingNoteId: null,
    billingReceiptDraft: null,
    paymentsExpanded: false,
    editingBillingSettings: false,
    contentTab: 'weaknesses',
    confirmDelete: null,
    solvedExpanded: false,
    progressExpanded: false,
    linkPanelOpen: false,
    manualBaseUrl: null,
    authEmail: '',
    authError: null,
    locked: false,
    loaded: false,
    loadFailed: false,
    noStorageApi: false,
    error: null
  };

  function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(d){
    const dt = new Date(d + 'T00:00:00');
    return (dt.getMonth()+1) + '/' + dt.getDate();
  }
  function daysBetween(a,b){
    return Math.floor((new Date(b) - new Date(a)) / (1000*60*60*24));
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function parseHashStudent(){
    const m = window.location.hash.match(/s=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function detectBaseUrl(){
    const href = window.location.href;
    if (href.indexOf('about:') !== 0) {
      return href.split('#')[0];
    }
    if (document.referrer && document.referrer.indexOf('about:') !== 0) {
      return document.referrer.split('#')[0];
    }
    return null;
  }

  function buildParentLink(studentId){
    const base = ui.manualBaseUrl || detectBaseUrl();
    if (!base) return null;
    return base.split('#')[0] + '#s=' + encodeURIComponent(studentId);
  }

  function localStorageAvailable(){
    try {
      const t = '__wt_probe__';
      window.localStorage.setItem(t, '1');
      window.localStorage.removeItem(t);
      return true;
    } catch(e) { return false; }
  }

  const STORAGE_MODE = sbClient
    ? 'supabase'
    : ((typeof window.storage !== 'undefined' && window.storage)
      ? 'cloud'
      : (localStorageAvailable() ? 'local' : 'none'));
  const LOCAL_PREFIX = 'wt-local::';

  async function rawGet(key){
    if (STORAGE_MODE === 'supabase') {
      return await sbGet(key);
    }
    if (STORAGE_MODE === 'cloud') {
      return await window.storage.get(key, true);
    }
    const raw = window.localStorage.getItem(LOCAL_PREFIX + key);
    if (raw === null) { const err = new Error('not found'); throw err; }
    return { key, value: raw, shared: false };
  }
  async function rawSet(key, value){
    if (STORAGE_MODE === 'supabase') {
      return await sbSet(key, value);
    }
    if (STORAGE_MODE === 'cloud') {
      return await window.storage.set(key, value, true);
    }
    window.localStorage.setItem(LOCAL_PREFIX + key, value);
    return { key, value, shared: false };
  }
  async function rawDelete(key){
    if (STORAGE_MODE === 'supabase') {
      const { data, error } = await sbClient.from(SUPABASE_TABLE).delete().eq('key', key).select();
      if (error) throw error;
      if (!data || data.length === 0) {
        throw new Error('삭제 정책(RLS)이 없어서 실제로는 지워지지 않았을 수 있어요');
      }
      return true;
    }
    if (STORAGE_MODE === 'cloud') {
      return await window.storage.delete(key, true);
    }
    window.localStorage.removeItem(LOCAL_PREFIX + key);
    return true;
  }

  let lastErrorDetail = null;

  function describeError(e){
    if (!e) return 'unknown error';
    const parts = [];
    if (e.message) parts.push(e.message);
    if (e.code) parts.push('code=' + e.code);
    if (e.details) parts.push('details=' + e.details);
    if (e.hint) parts.push('hint=' + e.hint);
    return parts.length ? parts.join(' | ') : String(e);
  }

  async function loadIndex(){
    try {
      const res = await rawGet(INDEX_KEY);
      index = res && res.value ? JSON.parse(res.value) : [];
    } catch(e) { index = []; lastErrorDetail = describeError(e); }
  }
  async function saveIndex(){
    try { await rawSet(INDEX_KEY, JSON.stringify(index)); }
    catch(e){ lastErrorDetail = describeError(e); }
  }
  async function loadStudentData(id){
    try {
      const res = await rawGet(studentKey(id));
      return res && res.value ? JSON.parse(res.value) : null;
    } catch(e) { lastErrorDetail = describeError(e); return null; }
  }
  async function saveStudentData(id, obj){
    try {
      const result = await rawSet(studentKey(id), JSON.stringify(obj));
      ui.error = result ? null : '저장에 실패했어요. 다시 시도해주세요.';
    } catch(e) {
      ui.error = '저장에 실패했어요. 다시 시도해주세요.';
      lastErrorDetail = describeError(e);
    }
  }
  async function persist(){
    const id = currentStudentId;
    const snapshot = studentData;
    await saveStudentData(id, snapshot);
    render();
  }

  async function selectStudent(id){
    currentStudentId = id;
    studentData = null;
    ui.loadFailed = false;
    render();
    const sd = await loadStudentData(id);
    if (currentStudentId !== id) return;
    if (sd) {
      studentData = sd;
    } else {
      ui.loadFailed = true;
    }
    ui.solvedExpanded = false;
    ui.progressExpanded = false;
    ui.editingWeaknessId = null;
    ui.editingCheckinKey = null;
    ui.editingProgressId = null;
    ui.editingStudentName = false;
    ui.confirmDelete = null;
    ui.checkinOpenFor = null;
    ui.checkinPrefillStatus = null;
    ui.addExamOpen = false;
    ui.editingExamId = null;
    ui.pastExamsExpanded = false;
    ui.addNoteOpen = false;
    ui.editingNoteId = null;
    ui.billingReceiptDraft = null;
    ui.paymentsExpanded = false;
    ui.editingBillingSettings = false;
    render();
  }

  let authed = false;

  async function checkAuth(){
    if (STORAGE_MODE !== 'supabase' || !sbClient) { authed = true; return; }
    try {
      const { data } = await sbClient.auth.getSession();
      authed = !!(data && data.session);
    } catch(e) { authed = false; }
  }

  async function load(){
    if (STORAGE_MODE === 'none') {
      ui.noStorageApi = true;
      ui.loaded = true;
      render();
      return;
    }
    const hashStudent = parseHashStudent();
    if (hashStudent) {
      ui.locked = true;
      mode = 'parent';
      currentStudentId = hashStudent;
      studentData = await loadStudentData(hashStudent);
      ui.loaded = true;
      render();
      return;
    }
    await checkAuth();
    if (!authed) {
      ui.loaded = true;
      render();
      return;
    }
    await loadIndex();
    if (index.length) {
      const preferred = index.find(s => s.active !== false) || index[0];
      currentStudentId = preferred.id;
      const sd = await loadStudentData(currentStudentId);
      if (sd) { studentData = sd; } else { ui.loadFailed = true; }
    }
    ui.loaded = true;
    render();
  }

  function isActive(id){
    const s = index.find(x => x.id === id);
    return !s || s.active !== false;
  }

  async function exportData(){
    const bundle = { version: 1, exportedAt: new Date().toISOString(), index: index, students: {} };
    for (const s of index) {
      const sd = await loadStudentData(s.id);
      if (sd) bundle.students[s.id] = sd;
    }
    const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'weakness-tracker-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function handleImportFile(file){
    try {
      const text = await file.text();
      const bundle = JSON.parse(text);
      if (!bundle || !Array.isArray(bundle.index)) throw new Error('invalid backup file');
      index = bundle.index;
      await saveIndex();
      const ids = Object.keys(bundle.students || {});
      for (const sid of ids) {
        await rawSet(studentKey(sid), JSON.stringify(bundle.students[sid]));
      }
      ui.error = null;
      if (index.length) {
        await selectStudent(index[0].id);
      } else {
        studentData = null;
        render();
      }
    } catch(e) {
      ui.error = '가져오기에 실패했어요. 이 앱에서 내보낸 백업 파일이 맞는지 확인해주세요.';
      lastErrorDetail = describeError(e);
      render();
    }
  }

  function currentStatus(w){
    if (!w.checkins || !w.checkins.length) return '진행중';
    const sorted = w.checkins.slice().sort((a,b)=> a.date.localeCompare(b.date));
    return sorted[sorted.length-1].status;
  }
  function lastUpdate(w){
    if (!w.checkins || !w.checkins.length) return w.createdAt;
    const sorted = w.checkins.slice().sort((a,b)=> a.date.localeCompare(b.date));
    return sorted[sorted.length-1].date;
  }

  function statusBadge(status, size, customLabel){
    const map = {
      '진행중': {bg:'var(--red-tint)', fg:'var(--red)', label:'교정중'},
      '해결': {bg:'var(--green-tint)', fg:'var(--green)', label:'해결'},
      '완료': {bg:'var(--green-tint)', fg:'var(--green)', label:'완료'},
      '재발': {bg:'var(--amber-tint)', fg:'var(--amber)', label:'재발'},
      '결과 대기': {bg:'var(--amber-tint)', fg:'var(--amber)', label:'결과 대기'},
      '예정': {bg:'var(--pen-tint)', fg:'var(--pen)', label:'예정'}
    };
    const s = map[status] || map['진행중'];
    const big = size === 'lg';
    const label = customLabel || s.label;
    return `<span class="mono" style="display:inline-block; padding:${big?'6px 14px':'5px 11px'}; border-radius:7px; background:${s.bg}; color:${s.fg}; font-size:${big?'12.5px':'14px'}; font-weight:700; letter-spacing:0.02em; white-space:nowrap;">${esc(label)}</span>`;
  }

  function examStatus(e){
    const today = todayStr();
    if (e.date && e.date > today) return '예정';
    if (e.result) return '완료';
    return '결과 대기';
  }
  function examDday(e){
    if (!e.date) return '';
    const days = daysBetween(todayStr(), e.date);
    if (days === 0) return 'D-DAY';
    if (days > 0) return 'D-' + days;
    return 'D+' + Math.abs(days);
  }

  function monthSummary(sd){
    const now = new Date();
    const thisMonth = now.toISOString().slice(0,7);
    let solvedThisMonth = [];
    let open = [];
    (sd.weaknesses || []).forEach(w => {
      const st = currentStatus(w);
      const lu = lastUpdate(w);
      if (st === '해결' && lu.slice(0,7) === thisMonth) solvedThisMonth.push(w);
      if (st !== '해결') open.push(w);
    });
    let stalest = null;
    open.forEach(w => {
      const days = daysBetween(lastUpdate(w), todayStr());
      if (!stalest || days > stalest.days) stalest = { w, days };
    });
    return { solvedThisMonth, open, stalest };
  }

  function renderStudentTabs(){
    if (ui.locked) return '';
    const tabBtn = (s, dim) => {
      const active = s.id === currentStudentId;
      return `<button data-action="select-student" data-id="${s.id}" style="
        padding:8px 16px; border-radius:20px; font-size: 15.5px; font-weight:500;
        background:${active ? 'var(--ink)' : '#fff'}; color:${active ? '#fff' : 'var(--ink-soft)'};
        border:1px solid ${active ? 'var(--ink)' : 'var(--line)'}; white-space:nowrap; ${dim ? 'opacity:0.6;' : ''}">${esc(s.name)}</button>`;
    };
    const activeList = index.filter(s => s.active !== false);
    const endedList = index.filter(s => s.active === false);
    const addBtn = mode === 'teacher'
      ? `<button data-action="toggle-add-student" style="padding:8px 14px; border-radius:20px; font-size: 15.5px; color:var(--pen); border:1px dashed var(--pen-tint); background:#fff; white-space:nowrap;">+ 학생 추가</button>`
      : '';
    let html = `<div class="wt-tabs-row" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;">${activeList.map(s => tabBtn(s, false)).join('')}${addBtn}</div>`;
    if (endedList.length) {
      html += `<button data-action="toggle-ended" style="margin-top:8px; font-size: 14.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;">
        수업 종료 학생 ${endedList.length}명 ${ui.endedExpanded ? '접기 ▲' : '보기 ▼'}
      </button>`;
      if (ui.endedExpanded) {
        html += `<div class="wt-tabs-row" style="display:flex; gap:8px; overflow-x:auto; padding:8px 0 0;">${endedList.map(s => tabBtn(s, true)).join('')}</div>`;
      }
    }
    return html;
  }

  function renderAddStudentForm(){
    if (!ui.addStudentOpen) return '';
    return `<div style="margin-top:12px; padding:14px; background:#fff; border:1px solid var(--line); border-radius:10px; display:flex; gap:8px; align-items:center;">
      <input id="wt-new-student-name" placeholder="학생 이름" style="flex:1;" />
      <button class="btn-primary" data-action="add-student">추가</button>
      <button class="btn-text" data-action="toggle-add-student">취소</button>
    </div>`;
  }

  function renderModeToggle(){
    if (ui.locked) return '';
    return `<div style="display:inline-flex; background:#fff; border:1px solid var(--line); border-radius:20px; padding:3px;">
      <button data-action="set-mode" data-mode="teacher" style="padding:6px 14px; border-radius:16px; font-size: 14.5px; font-weight:500;
        background:${mode==='teacher' ? 'var(--pen)' : 'transparent'}; color:${mode==='teacher' ? '#fff' : 'var(--ink-soft)'};">선생님 보기</button>
      <button data-action="set-mode" data-mode="parent" style="padding:6px 14px; border-radius:16px; font-size: 14.5px; font-weight:500;
        background:${mode==='parent' ? 'var(--pen)' : 'transparent'}; color:${mode==='parent' ? '#fff' : 'var(--ink-soft)'};">학부모 보기</button>
    </div>`;
  }

  function defaultBilling(){
    return { hasReceipt: false, receiptNumber: '', tuitionFee: '', monthlySessions: 0, currentSession: 0, payments: [] };
  }

  function renderBillingSection(sd){
    const b = sd.billing || defaultBilling();
    const isUnset = !b.hasReceipt && !b.tuitionFee && !b.monthlySessions;
    const editing = ui.editingBillingSettings || isUnset;
    const showReceiptField = ui.billingReceiptDraft !== null ? ui.billingReceiptDraft : !!b.hasReceipt;
    const needsConfirm = b.monthlySessions > 0 && b.currentSession >= b.monthlySessions;
    const payments = (b.payments || []).slice().sort((x,y)=> y.date.localeCompare(x.date));

    const settingsBlock = editing ? `
      <label style="display:flex; align-items:center; gap:8px; font-size: 15.5px; margin-bottom:10px; cursor:pointer;">
        <input type="checkbox" id="wt-billing-receipt" data-action="toggle-receipt-draft" ${showReceiptField ? 'checked' : ''} style="width:auto; min-height:auto;" />
        현금영수증 발행
      </label>
      ${showReceiptField ? `<input id="wt-billing-receipt-number" placeholder="현금영수증 번호" value="${esc(b.receiptNumber || '')}" style="margin-bottom:10px;" />` : ''}
      <input id="wt-billing-fee" placeholder="수업료 (예: 150000)" value="${esc(b.tuitionFee || '')}" style="margin-bottom:10px;" />
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">

      <div style="font-size: 15.5px; color:var(--ink-soft); line-height:1.9;">
        현금영수증 &nbsp;${b.hasReceipt ? `발행 <span class="mono" style="color:var(--ink-faint);">(${esc(b.receiptNumber || '번호 미입력')})</span>` : '미발행'}<br>
        수업료 &nbsp;${b.tuitionFee ? `<span style="color:var(--ink); font-weight:500;">${esc(b.tuitionFee)}원</span>` : '미입력'}<br>
        월 수업 횟수 &nbsp;${b.monthlySessions ? `<span style="color:var(--ink); font-weight:500;">${b.monthlySessions}회</span>` : '미설정'}

      <button class="btn-text" data-action="edit-billing-settings" style="margin-top:8px; color:var(--pen);">수정</button>
    `;

    return `<div style="background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:16px;">
      <div class="disp" style="font-size: 17px; font-weight:600; margin-bottom:12px;">수납 관리</div>

      ${settingsBlock}

      ${b.monthlySessions > 0 ? `
        <div style="border-top:1px solid var(--paper); margin-top:14px; padding-top:14px;">
          <div style="font-size: 15px; color:var(--ink-soft); margin-bottom:8px;">현재 수업 회차</div>
          <div style="display:flex; align-items:center; gap:14px;">
            <button class="btn-ghost" data-action="decrement-session" ${b.currentSession <= 0 ? 'disabled' : ''} style="min-width:44px;">−</button>
            <div class="disp" style="font-size: 24px; font-weight:700; min-width:64px; text-align:center;">${b.currentSession} / ${b.monthlySessions}</div>
            <button class="btn-ghost" data-action="increment-session" ${needsConfirm ? 'disabled' : ''} style="min-width:44px;">+</button>
          </div>
        </div>
      ` : ''}

      ${needsConfirm ? `
        <div style="margin-top:14px; padding:12px 14px; background:var(--amber-tint); border-radius:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <span style="font-size: 15.5px; color:var(--amber); font-weight:600;">수업료를 받아야 합니다</span>
          <button class="btn-primary" data-action="confirm-fee-due">확인</button>
        </div>
      ` : ''}

      ${payments.length ? `
        <div style="margin-top:16px; border-top:1px solid var(--paper); padding-top:12px;">
          <button data-action="toggle-payments" style="display:flex; align-items:center; gap:6px; font-size: 15px; color:var(--ink-soft);">
            수납 기록 <span class="mono" style="color:var(--ink-faint);">(${payments.length})</span> ${ui.paymentsExpanded ? '접기 ▲' : '보기 ▼'}
          </button>
          ${ui.paymentsExpanded ? payments.map(p => {
            const confirmingPayment = ui.confirmDelete && ui.confirmDelete.type === 'payment' && ui.confirmDelete.id === p.id;
            return `
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; flex-wrap:wrap; border-bottom:1px solid var(--paper);">
              <input type="date" class="wt-payment-date" data-payment-id="${p.id}" value="${esc(p.date)}" style="max-width:150px; font-size: 14.5px; padding:5px 8px;" />
              <label style="display:flex; align-items:center; gap:6px; font-size: 15px; cursor:pointer;">
                <input type="checkbox" data-action="toggle-payment-received" data-id="${p.id}" ${p.received ? 'checked' : ''} style="width:auto; min-height:auto;" />
                수업료 받음
              </label>
              ${confirmingPayment ? `
                <span style="font-size: 13.5px; color:var(--red);">삭제할까요?</span>
                <button class="btn-danger-text" data-action="confirm-delete">삭제</button>
                <button class="btn-text" data-action="cancel-delete">취소</button>
              ` : `
                <button class="btn-danger-text" data-action="delete-payment" data-id="${p.id}">삭제</button>
              `}
            </div>
          `;
          }).join('') : ''}
        </div>
      ` : ''}
    </div>`;
  }

  function renderLinkPanel(studentId, studentName){
    if (!ui.linkPanelOpen) return '';
    const base = ui.manualBaseUrl || detectBaseUrl();

    if (!base) {
      return `<div style="margin-top:12px; padding:14px; background:#fff; border:1px solid var(--red-tint); border-radius:10px;">
        <div style="font-size: 15px; color:var(--red); font-weight:500; margin-bottom:8px;">이 화면의 실제 주소를 자동으로 알아낼 수 없었어요.</div>
        <div style="font-size: 14.5px; color:var(--ink-soft); line-height:1.7; margin-bottom:12px;">
          로컬 파일이거나, 아직 게시되지 않은 미리보기 화면일 수 있어요. 게시하지 않으셨다면 먼저 Claude.ai에서 이 아티팩트를 "게시(Publish)"하거나, 무료 정적 호스팅(Netlify Drop 등)에 올려주세요.<br><br>
          이미 게시하셨는데 이 메시지가 뜬다면, 지금 브라우저 주소창에 보이는 진짜 주소를 아래에 직접 붙여넣어 주세요.
        </div>
        <div style="display:flex; gap:8px;">
          <input id="wt-manual-base-url" placeholder="https://claude.ai/public/artifacts/..." style="flex:1;" />
          <button class="btn-primary" data-action="set-manual-base-url">적용</button>
        </div>
      </div>`;
    }

    const link = buildParentLink(studentId);
    const localWarning = STORAGE_MODE === 'local'
      ? `<div style="font-size: 14.5px; color:var(--amber); margin-bottom:8px; padding:8px 10px; background:var(--amber-tint); border-radius:6px;">지금은 이 파일이 이 컴퓨터의 브라우저 안에만 저장돼 있어요. 이 링크는 다른 사람 기기에서 열면 기록이 보이지 않아요. 학부모께 실제로 보여드리려면 아래 "데이터 내보내기"로 백업 파일을 만들어 함께 전달해주세요.</div>`
      : '';
    return `<div style="margin-top:12px; padding:14px; background:#fff; border:1px solid var(--line); border-radius:10px;">
      ${localWarning}
      <div style="font-size: 14.5px; color:var(--ink-soft); margin-bottom:8px;">이 링크를 열면 ${esc(studentName)} 학생 기록만 불러와요. 다른 학생 데이터는 이 링크로는 아예 조회되지 않아요.</div>
      <div style="display:flex; gap:8px;">
        <input id="wt-parent-link" readonly value="${esc(link)}" onclick="this.select()" style="flex:1;" />
        <button class="btn-primary" data-action="copy-link">복사</button>
      </div>
      <div id="wt-copy-msg" style="font-size: 14px; color:var(--green); margin-top:6px; min-height:14px;"></div>
      <button class="btn-text" data-action="clear-manual-base-url" style="margin-top:4px;">이 주소가 틀렸다면 다시 입력하기</button>
    </div>`;
  }

  function renderContentTabs(sd){
    const openWeak = (sd.weaknesses || []).filter(w => currentStatus(w) !== '해결').length;
    const today = todayStr();
    const upcomingExams = (sd.exams || []).filter(e => e.date >= today).length;
    const noteCount = (sd.notes || []).length;
    const progressCount = (sd.progress || []).length;

    const tabs = [
      { id: 'weaknesses', label: '약점', count: openWeak },
      { id: 'exams', label: '시험 일정', count: upcomingExams },
    ];
    if (mode === 'teacher') tabs.push({ id: 'notes', label: '특이사항', count: noteCount });
    tabs.push({ id: 'progress', label: '진도 기록', count: progressCount });

    return `<div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;">
      ${tabs.map(t => {
        const active = ui.contentTab === t.id;
        return `<button data-action="set-content-tab" data-id="${t.id}" style="
          padding:10px 16px; border-radius:10px; font-size:14.5px; font-weight:600; white-space:nowrap;
          background:${active ? 'var(--ink)' : '#fff'}; color:${active ? '#fff' : 'var(--ink-soft)'};
          border:1px solid ${active ? 'var(--ink)' : 'var(--line)'};">${t.label}${t.count ? ` <span class="mono" style="font-weight:600; opacity:0.75;">${t.count}</span>` : ''}</button>`;
      }).join('')}
    </div>`;
  }

  function renderActiveContentSection(sd){
    let tab = ui.contentTab;
    if (tab === 'notes' && mode !== 'teacher') tab = 'weaknesses';
    if (tab === 'weaknesses') return renderWeaknessSection(sd);
    if (tab === 'exams') return renderExamSection(sd);
    if (tab === 'notes') return renderNoteSection(sd);
    if (tab === 'progress') return renderProgressSection(sd);
    return renderWeaknessSection(sd);
  }

  function renderSummary(sd){
    const { solvedThisMonth, open, stalest } = monthSummary(sd);
    const monthLabel = (new Date().getMonth()+1) + '월';
    let warn = '';
    if (stalest && stalest.days >= 14) {
      warn = `<div style="margin-top:12px; padding:10px 14px; background:var(--amber-tint); border-radius:8px; font-size: 15px; color:var(--amber); display:flex; gap:8px; align-items:baseline;">
        <span class="mono" style="font-weight:600;">주의</span>
        <span>'${esc(stalest.w.title)}' 항목이 ${stalest.days}일째 업데이트 없이 교정중이에요.</span>
      </div>`;
    }
    return `<div style="background:var(--card); border-radius:12px; padding:20px 22px; border:1px solid var(--line);">
      <div class="disp" style="font-size: 15.5px; color:var(--ink-faint); margin-bottom:14px; letter-spacing:0.02em;">${monthLabel} 요약</div>
      <div style="display:flex; gap:32px; flex-wrap:wrap;">
        <div>
          <div class="disp" style="font-size: 34px; font-weight:700; color:var(--green); line-height:1;">${solvedThisMonth.length}</div>
          <div style="font-size: 14.5px; color:var(--ink-soft); margin-top:6px;">이번 달 해결한 약점</div>
        </div>
        <div>
          <div class="disp" style="font-size: 34px; font-weight:700; color:var(--red); line-height:1;">${open.length}</div>
          <div style="font-size: 14.5px; color:var(--ink-soft); margin-top:6px;">현재 교정중인 약점</div>
        </div>
      </div>
      ${solvedThisMonth.length ? `<div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line); font-size: 15px; color:var(--ink-soft);">
        ${solvedThisMonth.map(w => `<span style="display:inline-block; margin:3px 6px 3px 0; padding:3px 10px; background:var(--green-tint); color:var(--green); border-radius:14px; font-size: 14.5px;">${esc(w.title)}</span>`).join('')}
      </div>` : ''}
      ${warn}
    </div>`;
  }

  function renderCheckinRow(w, c, isLast){
    const key = w.id + '::' + c.id;
    const editing = ui.editingCheckinKey === key;
    const confirming = ui.confirmDelete && ui.confirmDelete.type === 'checkin' && ui.confirmDelete.id === c.id && ui.confirmDelete.weaknessId === w.id;
    const editable = mode === 'teacher';
    const borderStyle = isLast ? '' : 'border-bottom:1px solid var(--paper);';

    if (editing) {
      return `<div style="padding:8px 0; ${borderStyle}">
        <div style="display:flex; gap:8px; margin-bottom:6px;">
          <input type="date" id="wt-editcheckin-date-${c.id}" value="${esc(c.date)}" style="max-width:150px;" />
          <select id="wt-editcheckin-status-${c.id}" style="max-width:120px;">
            <option value="진행중" ${c.status==='진행중'?'selected':''}>교정중</option>
            <option value="재발" ${c.status==='재발'?'selected':''}>재발</option>
            <option value="해결" ${c.status==='해결'?'selected':''}>해결</option>
          </select>
        </div>
        <textarea id="wt-editcheckin-note-${c.id}" rows="2" style="margin-bottom:6px; resize:vertical;">${esc(c.note || '')}</textarea>
        <div style="display:flex; gap:8px;">
          <button class="btn-primary" data-action="save-edit-checkin" data-id="${c.id}" data-parent="${w.id}">저장</button>
          <button class="btn-text" data-action="cancel-edit-checkin">취소</button>
        </div>
      </div>`;
    }

    return `<div style="display:flex; gap:10px; padding:7px 0; align-items:center; ${borderStyle}">
      <div class="mono" style="font-size: 14px; color:var(--ink-faint); min-width:36px;">${fmtDate(c.date)}</div>
      <div style="flex-shrink:0;">${statusBadge(c.status)}</div>
      <div style="font-size: 15px; color:var(--ink-soft); line-height:1.5; flex:1;">${esc(c.note || '')}</div>
      ${editable ? (confirming ? `
        <div style="display:flex; gap:6px; align-items:center; flex-shrink:0;">
          <span style="font-size: 13.5px; color:var(--red);">삭제할까요?</span>
          <button class="btn-danger-text" data-action="confirm-delete">삭제</button>
          <button class="btn-text" data-action="cancel-delete">취소</button>
        </div>
      ` : `
        <div style="display:flex; gap:2px; flex-shrink:0;">
          <button class="btn-text" data-action="edit-checkin" data-id="${c.id}" data-parent="${w.id}">수정</button>
          <button class="btn-danger-text" data-action="delete-checkin" data-id="${c.id}" data-parent="${w.id}">삭제</button>
        </div>
      `) : ''}
    </div>`;
  }

  function renderCheckinTimeline(w){
    const sorted = (w.checkins || []).slice().sort((a,b)=> a.date.localeCompare(b.date));
    if (!sorted.length) return `<div style="font-size: 14.5px; color:var(--ink-faint); padding:8px 0;">아직 체크인 기록이 없어요.</div>`;
    return `<div style="margin-top:10px;">${sorted.map((c,i) => renderCheckinRow(w, c, i === sorted.length-1)).join('')}</div>`;
  }

  function renderCheckinForm(w){
    if (ui.checkinOpenFor !== w.id) return '';
    const defaultStatus = ui.checkinPrefillStatus || '진행중';
    return `<div style="margin-top:10px; padding:12px; background:var(--paper); border-radius:8px;">
      <div style="display:flex; gap:8px; margin-bottom:8px;">
        <input type="date" id="wt-checkin-date-${w.id}" value="${todayStr()}" style="max-width:150px;" />
        <select id="wt-checkin-status-${w.id}" style="max-width:120px;">
          <option value="진행중" ${defaultStatus==='진행중'?'selected':''}>교정중</option>
          <option value="재발" ${defaultStatus==='재발'?'selected':''}>재발</option>
          <option value="해결" ${defaultStatus==='해결'?'selected':''}>해결</option>
        </select>
      </div>
      <textarea id="wt-checkin-note-${w.id}" placeholder="이번 수업에서 확인한 내용을 짧게 적어주세요" rows="2" style="margin-bottom:8px; resize:vertical;"></textarea>
      <div style="display:flex; gap:8px;">
        <button class="btn-primary" data-action="save-checkin" data-id="${w.id}">체크인 저장</button>
        <button class="btn-text" data-action="close-checkin">취소</button>
      </div>
    </div>`;
  }

  function renderWeaknessCard(w){
    const status = currentStatus(w);
    const editable = mode === 'teacher';
    const isEditing = ui.editingWeaknessId === w.id;
    const isConfirming = ui.confirmDelete && ui.confirmDelete.type === 'weakness' && ui.confirmDelete.id === w.id;

    if (isEditing) {
      return `<div style="background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:10px;">
        <div style="font-size: 15px; color:var(--ink-soft); margin-bottom:6px;">약점 내용</div>
        <textarea id="wt-edit-weakness-title-${w.id}" rows="2" style="margin-bottom:10px; resize:vertical;">${esc(w.title)}</textarea>
        <div style="font-size: 15px; color:var(--ink-soft); margin-bottom:6px;">지도 방향</div>
        <textarea id="wt-edit-weakness-action-${w.id}" rows="2" style="margin-bottom:10px; resize:vertical;">${esc(w.action || '')}</textarea>
        <div style="display:flex; gap:8px;">
          <button class="btn-primary" data-action="save-edit-weakness" data-id="${w.id}">저장</button>
          <button class="btn-text" data-action="cancel-edit-weakness">취소</button>
        </div>
      </div>`;
    }

    return `<div style="background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
        <div style="flex:1;">
          <div style="font-size: 16.5px; font-weight:500; line-height:1.5;">${esc(w.title)}</div>
          ${w.action ? `<div style="font-size: 15px; color:var(--ink-soft); margin-top:5px; line-height:1.6;">${esc(w.action)}</div>` : ''}
          <div class="mono" style="font-size: 13.5px; color:var(--ink-faint); margin-top:8px;">최초 기록 ${fmtDate(w.createdAt)} · 최근 업데이트 ${fmtDate(lastUpdate(w))}</div>
        </div>
        <div>${statusBadge(status, 'lg')}</div>
      </div>
      ${editable ? `<div style="margin-top:10px;">
        ${isConfirming ? `
          <span style="font-size: 14.5px; color:var(--red); margin-right:8px;">삭제할까요? 체크인 기록도 함께 삭제돼요.</span>
          <button class="btn-danger-text" data-action="confirm-delete">삭제</button>
          <button class="btn-text" data-action="cancel-delete">취소</button>
        ` : `
          <button class="btn-text" data-action="edit-weakness" data-id="${w.id}">수정</button>
          <button class="btn-danger-text" data-action="delete-weakness" data-id="${w.id}">삭제</button>

      </div>` : ''}
      ${renderCheckinTimeline(w)}
      ${editable ? renderCheckinForm(w) : ''}
      ${editable && ui.checkinOpenFor !== w.id ? `<button class="btn-text" data-action="open-checkin" data-id="${w.id}" style="margin-top:8px; color:var(--pen);">+ 체크인 기록하기</button>` : ''}

  function renderAddWeaknessForm(){
    if (!ui.addWeaknessOpen) return '';
    return `<div style="background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px;">
      <div style="font-size: 15px; color:var(--ink-soft); margin-bottom:6px;">약점 내용</div>
      <textarea id="wt-new-weakness-title" rows="2" placeholder="예: 이차식의 값 범위를 함숫값 변화로 관찰하지 못함" style="margin-bottom:10px; resize:vertical;"></textarea>
      <div style="font-size: 15px; color:var(--ink-soft); margin-bottom:6px;">지도 방향 (선택)</div>
      <textarea id="wt-new-weakness-action" rows="2" placeholder="예: x의 변화에 따른 함숫값 변화로 관찰하도록 지도" style="margin-bottom:10px; resize:vertical;"></textarea>
      <div style="display:flex; gap:8px;">

        <button class="btn-text" data-action="toggle-add-weakness">취소</button>
      </div>
    </div>`;
  }

  function renderWeaknessSection(sd){
    const ws = sd.weaknesses || [];
    const open = ws.filter(w => currentStatus(w) !== '해결').sort((a,b)=> lastUpdate(b).localeCompare(lastUpdate(a)));

      </div>
      ${mode === 'teacher' ? renderBillingSection(sd) : ''}
      ${(!ui.locked && mode === 'teacher' && !editingName) ? `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;">
        <div style="display:flex; gap:4px; align-items:center; flex-wrap:wrap;">
          ${confirmingStudentDelete ? `
            <span style="font-size: 14.5px; color:var(--red);">'${esc(sd.name)}' 학생과 모든 기록을 삭제할까요?</span>
            <button class="btn-danger-text" data-action="confirm-delete">삭제</button>
            <button class="btn-text" data-action="cancel-delete">취소</button>
          ` : `
            <button class="btn-text" data-action="start-edit-student-name">이름 수정</button>
            <button class="btn-text" data-action="toggle-student-active" data-id="${currentStudentId}">${isActive(currentStudentId) ? '수업 종료로 표시' : '다시 활성화'}</button>
            <button class="btn-ghost" data-action="toggle-link-panel">학부모 링크 만들기</button>
            <button class="btn-danger-text" data-action="delete-student" data-id="${currentStudentId}">학생 삭제</button>
          `}
        </div>
      </div>` : ''}
      ${(!ui.locked && mode === 'teacher') ? `<div style="display:flex; justify-content:flex-end; gap:12px; margin-bottom:14px; align-items:center; flex-wrap:wrap;">
        <span class="mono" style="font-size: 13px; color:var(--ink-faint);">${STORAGE_MODE === 'supabase' ? '저장 위치: Supabase (기기 상관없이 공유됨)' : STORAGE_MODE === 'cloud' ? '저장 위치: 공유 저장소 (링크로 공유 가능)' : '저장 위치: 이 브라우저 (이 기기에만 저장됨)'}</span>
        ${STORAGE_MODE !== 'supabase' && !sbClient && SUPABASE_URL && SUPABASE_URL.indexOf('YOUR_') !== 0 ? `<span class="mono" style="font-size: 13px; color:var(--red);">Supabase 연결 실패 — 콘솔을 확인해주세요</span>` : ''}
        <button class="btn-text" data-action="export-data">데이터 내보내기</button>
        <button class="btn-text" data-action="trigger-import">가져오기</button>
        <input type="file" id="wt-import-file" accept="application/json" style="display:none;" />
      </div>` : ''}
      ${(!ui.locked && mode === 'teacher') ? renderLinkPanel(currentStudentId, sd.name) : ''}
      ${renderStudentTabs()}
      ${renderAddStudentForm()}
      <div style="height:20px;"></div>
      ${renderSummary(sd)}
      <div style="height:20px;"></div>
      ${renderContentTabs(sd)}
      <div style="height:16px;"></div>
      ${renderActiveContentSection(sd)}
      ${ui.error ? `<div style="margin-top:14px; font-size: 14.5px; color:var(--red);">${esc(ui.error)}</div>` : ''}
      <div style="margin-top:20px; font-size: 13.5px; color:var(--ink-faint);">${ui.locked ? '이 링크는 이 학생의 기록만 불러와요.' : '학부모 링크로 접속한 사람은 해당 학생 데이터만 조회할 수 있어요.'}</div>
      ${lastErrorDetail ? `<div class="mono" style="margin-top:6px; font-size: 13px; color:var(--ink-faint);">last error: ${esc(lastErrorDetail)}</div>` : ''}
    `;
    attachEvents();
  }

  function attachEvents(){
    root.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', onAction);
    });
    const fileInput = document.getElementById('wt-import-file');
    if (fileInput) {
      fileInput.addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) handleImportFile(f);
      });
    }
    root.querySelectorAll('.wt-payment-date').forEach(el => {
      el.addEventListener('change', async (e) => {
        const pid = e.target.getAttribute('data-payment-id');
        const val = e.target.value;
        if (!val) return;
        studentData.billing = studentData.billing || defaultBilling();
        const p = (studentData.billing.payments || []).find(x => x.id === pid);
        if (!p) return;
        p.date = val;
        await persist();
      });
    });
  }

  async function onAction(e){
    const action = e.currentTarget.getAttribute('data-action');
    const id = e.currentTarget.getAttribute('data-id');
    const parent = e.currentTarget.getAttribute('data-parent');

    if (action === 'select-student') { await selectStudent(id); return; }
    if (action === 'set-content-tab') { ui.contentTab = id; render(); return; }
    if (action === 'login') {
      const emailInput = document.getElementById('wt-login-email');
      const passInput = document.getElementById('wt-login-password');
      const email = emailInput ? emailInput.value.trim() : '';
      const password = passInput ? passInput.value : '';
      ui.authEmail = email;
      if (!email || !password) { ui.authError = '이메일과 비밀번호를 입력해주세요.'; render(); return; }
      try {
        const { error } = await sbClient.auth.signInWithPassword({ email, password });
        if (error) { ui.authError = error.message; render(); return; }
        ui.authError = null;
        ui.loaded = false;
        render();
        await load();
      } catch(e) {
        ui.authError = describeError(e);
        render();
      }
      return;
    }
    if (action === 'logout') {
      try { await sbClient.auth.signOut(); } catch(e) {}
      authed = false;
      index = [];
      currentStudentId = null;
      studentData = null;
      render();
      return;
    }
    if (action === 'retry-load') {
      if (ui.locked) {
        studentData = await loadStudentData(currentStudentId);
        render();
      } else {
        await selectStudent(currentStudentId);
      }
      return;
    }
    if (action === 'set-mode') {
      mode = e.currentTarget.getAttribute('data-mode');
      ui.addWeaknessOpen = false; ui.addStudentOpen = false; ui.addProgressOpen = false;
      ui.checkinOpenFor = null; ui.editingWeaknessId = null; ui.editingCheckinKey = null;
      ui.editingProgressId = null; ui.confirmDelete = null;
      ui.addExamOpen = false; ui.editingExamId = null;
      ui.addNoteOpen = false; ui.editingNoteId = null;
      render(); return;
    }
    if (action === 'toggle-add-student') { ui.addStudentOpen = !ui.addStudentOpen; render(); return; }
    if (action === 'toggle-add-weakness') { ui.addWeaknessOpen = !ui.addWeaknessOpen; render(); return; }
    if (action === 'toggle-add-progress') { ui.addProgressOpen = !ui.addProgressOpen; render(); return; }
    if (action === 'toggle-solved') { ui.solvedExpanded = !ui.solvedExpanded; render(); return; }
    if (action === 'toggle-progress') { ui.progressExpanded = !ui.progressExpanded; render(); return; }
    if (action === 'open-checkin') { ui.checkinOpenFor = id; ui.checkinPrefillStatus = null; render(); return; }
    if (action === 'close-checkin') { ui.checkinOpenFor = null; ui.checkinPrefillStatus = null; render(); return; }
    if (action === 'mark-recurrence') { ui.checkinOpenFor = id; ui.checkinPrefillStatus = '재발'; ui.solvedExpanded = true; render(); return; }
    if (action === 'toggle-ended') { ui.endedExpanded = !ui.endedExpanded; render(); return; }
    if (action === 'toggle-student-active') {
      const s = index.find(x => x.id === id);
      if (s) { s.active = (s.active === false) ? true : false; }
      await saveIndex();
      render();
      return;
    }
    if (action === 'toggle-link-panel') { ui.linkPanelOpen = !ui.linkPanelOpen; render(); return; }

    // ---- 수납 관리 ----
    if (action === 'toggle-receipt-draft') {
      ui.billingReceiptDraft = e.currentTarget.checked;
      render();
      return;
    }
    if (action === 'edit-billing-settings') { ui.editingBillingSettings = true; render(); return; }
    if (action === 'cancel-billing-settings') { ui.editingBillingSettings = false; ui.billingReceiptDraft = null; render(); return; }
    if (action === 'save-billing-settings') {
      const receiptInput = document.getElementById('wt-billing-receipt');
      const receiptNumberInput = document.getElementById('wt-billing-receipt-number');
      const feeInput = document.getElementById('wt-billing-fee');
      const sessionsInput = document.getElementById('wt-billing-sessions');
      studentData.billing = studentData.billing || defaultBilling();
      const b = studentData.billing;
      b.hasReceipt = receiptInput ? receiptInput.checked : b.hasReceipt;
      b.receiptNumber = b.hasReceipt ? (receiptNumberInput ? receiptNumberInput.value.trim() : b.receiptNumber) : '';
      b.tuitionFee = feeInput ? feeInput.value.trim() : b.tuitionFee;
      const sessionsVal = sessionsInput ? parseInt(sessionsInput.value, 10) : NaN;
      b.monthlySessions = (!isNaN(sessionsVal) && sessionsVal > 0) ? sessionsVal : 0;
      if (b.currentSession > b.monthlySessions) b.currentSession = 0;
      ui.billingReceiptDraft = null;
      ui.editingBillingSettings = false;
      await persist();
      return;
    }
    if (action === 'increment-session') {
      studentData.billing = studentData.billing || defaultBilling();
      const b = studentData.billing;
      if (b.currentSession < b.monthlySessions) { b.currentSession += 1; }
      await persist();
      return;
    }
    if (action === 'decrement-session') {
      studentData.billing = studentData.billing || defaultBilling();
      const b = studentData.billing;
      if (b.currentSession > 0) { b.currentSession -= 1; }
      await persist();
      return;
    }
    if (action === 'confirm-fee-due') {
      studentData.billing = studentData.billing || defaultBilling();
      const b = studentData.billing;
      b.payments = b.payments || [];
      b.payments.push({ id: uid(), date: todayStr(), received: false });
      b.currentSession = 0;
      await persist();
      return;
    }
    if (action === 'toggle-payment-received') {
      studentData.billing = studentData.billing || defaultBilling();
      const b = studentData.billing;
      const p = (b.payments || []).find(x => x.id === id);
      if (p) p.received = e.currentTarget.checked;
      await persist();
      return;
    }
    if (action === 'toggle-payments') { ui.paymentsExpanded = !ui.paymentsExpanded; render(); return; }
    if (action === 'delete-payment') { ui.confirmDelete = { type: 'payment', id }; render(); return; }
    if (action === 'set-manual-base-url') {
      const input = document.getElementById('wt-manual-base-url');
      const val = input ? input.value.trim() : '';
      if (!val) return;
      ui.manualBaseUrl = val;
      render();
      return;
    }
    if (action === 'clear-manual-base-url') { ui.manualBaseUrl = null; render(); return; }
    if (action === 'start-edit-student-name') { ui.editingStudentName = true; render(); return; }
    if (action === 'cancel-edit-student-name') { ui.editingStudentName = false; render(); return; }
    if (action === 'save-edit-student-name') {
      const nameInput = document.getElementById('wt-edit-student-name');
      const name = nameInput ? nameInput.value.trim() : '';
      if (!name) return;
      const s = index.find(x => x.id === currentStudentId);
      if (s) s.name = name;
      await saveIndex();
      studentData.name = name;
      ui.editingStudentName = false;
      await persist();
      return;
    }
    if (action === 'delete-student') { ui.confirmDelete = { type: 'student', id }; render(); return; }
    if (action === 'export-data') { await exportData(); return; }
    if (action === 'trigger-import') {
      const fileInput = document.getElementById('wt-import-file');
      if (fileInput) fileInput.click();
      return;
    }

    if (action === 'edit-weakness') { ui.editingWeaknessId = id; ui.confirmDelete = null; render(); return; }
    if (action === 'cancel-edit-weakness') { ui.editingWeaknessId = null; render(); return; }
    if (action === 'delete-weakness') { ui.confirmDelete = { type: 'weakness', id }; render(); return; }

    if (action === 'edit-checkin') { ui.editingCheckinKey = parent + '::' + id; ui.confirmDelete = null; render(); return; }
    if (action === 'cancel-edit-checkin') { ui.editingCheckinKey = null; render(); return; }
    if (action === 'delete-checkin') { ui.confirmDelete = { type: 'checkin', id, weaknessId: parent }; render(); return; }

    if (action === 'edit-progress') { ui.editingProgressId = id; ui.confirmDelete = null; render(); return; }
    if (action === 'cancel-edit-progress') { ui.editingProgressId = null; render(); return; }
    if (action === 'delete-progress') { ui.confirmDelete = { type: 'progress', id }; render(); return; }

    if (action === 'cancel-delete') { ui.confirmDelete = null; render(); return; }

    if (action === 'confirm-delete') {
      const cd = ui.confirmDelete;
      if (!cd) return;
      if (cd.type === 'student') {
        const deletedId = cd.id;
        index = index.filter(s => s.id !== deletedId);
        await saveIndex();
        let deleteFailed = false;
        try { await rawDelete(studentKey(deletedId)); }
        catch(e) { deleteFailed = true; lastErrorDetail = describeError(e); }
        ui.confirmDelete = null;
        ui.error = deleteFailed
          ? '학생 목록에서는 지웠지만, 실제 데이터 삭제에는 실패했을 수 있어요. Supabase에 delete 정책이 있는지 확인해주세요.'
          : null;
        if (index.length) {
          const preferred = index.find(s => s.active !== false) || index[0];
          await selectStudent(preferred.id);
        } else {
          currentStudentId = null;
          studentData = null;
          render();
        }
        return;
      }
      if (cd.type === 'weakness') {
        studentData.weaknesses = (studentData.weaknesses || []).filter(w => w.id !== cd.id);
      } else if (cd.type === 'checkin') {
        const w = (studentData.weaknesses || []).find(x => x.id === cd.weaknessId);
        if (w) w.checkins = (w.checkins || []).filter(c => c.id !== cd.id);
      } else if (cd.type === 'progress') {
        studentData.progress = (studentData.progress || []).filter(p => p.id !== cd.id);
      } else if (cd.type === 'exam') {
        studentData.exams = (studentData.exams || []).filter(e => e.id !== cd.id);
      } else if (cd.type === 'note') {
        studentData.notes = (studentData.notes || []).filter(n => n.id !== cd.id);
      } else if (cd.type === 'payment') {
        studentData.billing = studentData.billing || defaultBilling();
        studentData.billing.payments = (studentData.billing.payments || []).filter(p => p.id !== cd.id);
      }
      ui.confirmDelete = null;
      await persist();
      return;
    }

    if (action === 'copy-link') {
      const input = document.getElementById('wt-parent-link');
      const msg = document.getElementById('wt-copy-msg');
      if (!input) return;
      input.select();
      let copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(input.value);
          copied = true;
        }
      } catch(err) { copied = false; }
      if (!copied) {
        try { copied = document.execCommand('copy'); } catch(err) { copied = false; }
      }
      if (msg) msg.textContent = copied ? '복사했어요.' : '자동 복사가 안 됐어요. 입력창을 눌러 직접 선택해서 복사해주세요.';
      return;
    }

    if (action === 'add-student') {
      const nameInput = document.getElementById('wt-new-student-name');
      const name = nameInput ? nameInput.value.trim() : '';
      if (!name) return;
      const newId = uid();
      index.push({ id: newId, name, createdAt: todayStr(), active: true });
      await saveIndex();
      currentStudentId = newId;
      studentData = { name, createdAt: todayStr(), weaknesses: [], progress: [], exams: [], notes: [], billing: defaultBilling() };
      ui.addStudentOpen = false;
      await persist();
      return;
    }

    if (action === 'add-weakness') {
      const titleInput = document.getElementById('wt-new-weakness-title');
      const actionInput = document.getElementById('wt-new-weakness-action');
      const title = titleInput ? titleInput.value.trim() : '';
      if (!title) return;
      studentData.weaknesses = studentData.weaknesses || [];
      studentData.weaknesses.push({
        id: uid(),
        title,
        action: actionInput ? actionInput.value.trim() : '',
        createdAt: todayStr(),
        checkins: []
      });
      ui.addWeaknessOpen = false;
      await persist();
      return;
    }

    if (action === 'save-edit-weakness') {
      const titleInput = document.getElementById('wt-edit-weakness-title-' + id);
      const actionInput = document.getElementById('wt-edit-weakness-action-' + id);
      const title = titleInput ? titleInput.value.trim() : '';
      if (!title) return;
      const w = (studentData.weaknesses || []).find(x => x.id === id);
      if (!w) return;
      w.title = title;
      w.action = actionInput ? actionInput.value.trim() : '';
      ui.editingWeaknessId = null;
      await persist();
      return;
    }

    // ---- 시험 일정 ----
    if (action === 'toggle-add-exam') { ui.addExamOpen = !ui.addExamOpen; render(); return; }
    if (action === 'toggle-past-exams') { ui.pastExamsExpanded = !ui.pastExamsExpanded; render(); return; }
    if (action === 'edit-exam') { ui.editingExamId = id; ui.confirmDelete = null; render(); return; }
    if (action === 'cancel-edit-exam') { ui.editingExamId = null; render(); return; }
    if (action === 'delete-exam') { ui.confirmDelete = { type: 'exam', id }; render(); return; }

    if (action === 'add-exam') {
      const titleInput = document.getElementById('wt-new-exam-title');
      const dateInput = document.getElementById('wt-new-exam-date');
      const scopeInput = document.getElementById('wt-new-exam-scope');
      const title = titleInput ? titleInput.value.trim() : '';
      if (!title) return;
      studentData.exams = studentData.exams || [];
      studentData.exams.push({
        id: uid(),
        title,
        date: dateInput ? dateInput.value || todayStr() : todayStr(),
        scope: scopeInput ? scopeInput.value.trim() : '',
        result: '',
        feedback: '',
        createdAt: todayStr()
      });
      ui.addExamOpen = false;
      await persist();
      return;
    }

    if (action === 'save-edit-exam') {
      const titleInput = document.getElementById('wt-edit-exam-title-' + id);
      const dateInput = document.getElementById('wt-edit-exam-date-' + id);
      const scopeInput = document.getElementById('wt-edit-exam-scope-' + id);
      const resultInput = document.getElementById('wt-edit-exam-result-' + id);
      const feedbackInput = document.getElementById('wt-edit-exam-feedback-' + id);
      const title = titleInput ? titleInput.value.trim() : '';
      if (!title) return;
      const e = (studentData.exams || []).find(x => x.id === id);
      if (!e) return;
      e.title = title;
      e.date = dateInput ? dateInput.value || e.date : e.date;
      e.scope = scopeInput ? scopeInput.value.trim() : e.scope;
      e.result = resultInput ? resultInput.value.trim() : e.result;
      e.feedback = feedbackInput ? feedbackInput.value.trim() : e.feedback;
      ui.editingExamId = null;
      await persist();
      return;
    }

    // ---- 학생 특이사항 ----
    if (action === 'toggle-add-note') { ui.addNoteOpen = !ui.addNoteOpen; render(); return; }
    if (action === 'edit-note') { ui.editingNoteId = id; ui.confirmDelete = null; render(); return; }
    if (action === 'cancel-edit-note') { ui.editingNoteId = null; render(); return; }
    if (action === 'delete-note') { ui.confirmDelete = { type: 'note', id }; render(); return; }

    if (action === 'add-note') {
      const dateInput = document.getElementById('wt-new-note-date');
      const contentInput = document.getElementById('wt-new-note-content');
      const content = contentInput ? contentInput.value.trim() : '';
      if (!content) return;
      studentData.notes = studentData.notes || [];
      studentData.notes.push({
        id: uid(),
        date: dateInput ? dateInput.value || todayStr() : todayStr(),
        content,
        createdAt: todayStr()
      });
      ui.addNoteOpen = false;
      await persist();
      return;
    }

    if (action === 'save-edit-note') {
      const dateInput = document.getElementById('wt-edit-note-date-' + id);
      const contentInput = document.getElementById('wt-edit-note-content-' + id);
      const content = contentInput ? contentInput.value.trim() : '';
      if (!content) return;
      const n = (studentData.notes || []).find(x => x.id === id);
      if (!n) return;
      n.date = dateInput ? dateInput.value || n.date : n.date;
      n.content = content;
      ui.editingNoteId = null;
      await persist();
      return;
    }

    if (action === 'save-checkin') {
      const dateInput = document.getElementById('wt-checkin-date-' + id);
      const statusInput = document.getElementById('wt-checkin-status-' + id);
      const noteInput = document.getElementById('wt-checkin-note-' + id);
      const w = (studentData.weaknesses || []).find(x => x.id === id);
      if (!w) return;
      w.checkins = w.checkins || [];
      w.checkins.push({
        id: uid(),
        date: dateInput ? dateInput.value || todayStr() : todayStr(),
        status: statusInput ? statusInput.value : '진행중',
        note: noteInput ? noteInput.value.trim() : ''
      });
      ui.checkinOpenFor = null;
      ui.checkinPrefillStatus = null;
      await persist();
      return;
    }

    if (action === 'save-edit-checkin') {
      const dateInput = document.getElementById('wt-editcheckin-date-' + id);
      const statusInput = document.getElementById('wt-editcheckin-status-' + id);
      const noteInput = document.getElementById('wt-editcheckin-note-' + id);
      const w = (studentData.weaknesses || []).find(x => x.id === parent);
      if (!w) return;
      const c = (w.checkins || []).find(x => x.id === id);
      if (!c) return;
      c.date = dateInput ? dateInput.value || c.date : c.date;
      c.status = statusInput ? statusInput.value : c.status;
      c.note = noteInput ? noteInput.value.trim() : c.note;
      ui.editingCheckinKey = null;
      await persist();
      return;
    }

    if (action === 'add-progress') {
      const dateInput = document.getElementById('wt-new-progress-date');
      const contentInput = document.getElementById('wt-new-progress-content');
      const content = contentInput ? contentInput.value.trim() : '';
      if (!content) return;
      studentData.progress = studentData.progress || [];
      studentData.progress.push({
        id: uid(),
        date: dateInput ? dateInput.value || todayStr() : todayStr(),
        content
      });
      ui.addProgressOpen = false;
      await persist();
      return;
    }

    if (action === 'save-edit-progress') {
      const dateInput = document.getElementById('wt-editprogress-date-' + id);
      const contentInput = document.getElementById('wt-editprogress-content-' + id);
      const content = contentInput ? contentInput.value.trim() : '';
      if (!content) return;
      const p = (studentData.progress || []).find(x => x.id === id);
      if (!p) return;
      p.date = dateInput ? dateInput.value || p.date : p.date;
      p.content = content;
      ui.editingProgressId = null;
      await persist();
      return;
    }
  }

  load();
})();
</script>

</body>
</html>
